<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload the Latin subset of Inter (critical path font) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/inter-latin-wght-normal-Dx4kXJAl.woff2"
      crossorigin="anonymous"
    />

    <!-- Flash-of-wrong-theme prevention: runs before any CSS/JS -->
    <script>
      try {
        var s = localStorage.getItem('theme');
        if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>

    <!-- Primary meta -->
    <title>Krrish Raj — Software Engineering Portfolio</title>
    <meta name="description" content="TODO — Short description of your portfolio for search engines." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#09090b" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://TODO.your-domain.com" />
    <meta property="og:title"       content="TODO Full Name — Software Engineering Portfolio" />
    <meta property="og:description" content="TODO — Short description for social shares." />
    <meta property="og:image"       content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="TODO Full Name — Software Engineering Portfolio" />
    <meta name="twitter:description" content="TODO — Short description for Twitter." />
    <meta name="twitter:image"       content="/og-image.png" />

    <!-- Person JSON-LD structured data -->

    {
      "@context": "https://schema.org",

      "name": "TODO Full Name",

        "https://github.com/git-krrishraj",
        "https://linkedin.com/in/krrish-raj-78a665364"
      ],
      "jobTitle": "Software Engineering Student",
      "description": "Electrical Engineering undergraduate from India building software."
    }
    </script>
  </head>

  </body>
</html>
